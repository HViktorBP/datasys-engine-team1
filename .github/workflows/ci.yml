name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven
      - run: mvn -B verify
      - run: python3 -m venv /tmp/experiment-python
      - run: /tmp/experiment-python/bin/python -m pip install -r scripts/experiment-requirements.txt
      - run: /tmp/experiment-python/bin/python -m unittest discover -s scripts/tests -v
        env:
          PYTHONPATH: scripts
